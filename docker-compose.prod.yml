version: '3.8'

# Docker Compose для продакшн-деплоя MGP AI Assistant
# 
# Использование:
#   1. Скопируйте env.production в .env
#   2. Заполните переменные (DATABASE_URL, API ключи)
#   3. docker-compose -f docker-compose.prod.yml up -d

services:
  # ==================== MGP AI Assistant API ====================
  mgp-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mgp_assistant
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Приложение
      - APP_NAME=${APP_NAME:-MGP AI Assistant}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - DEBUG=${DEBUG:-false}
      - HOST=0.0.0.0
      - PORT=8000
      
      # PostgreSQL
      - DATABASE_URL=${DATABASE_URL}
      
      # Аналитика
      - ENABLE_ANALYTICS=${ENABLE_ANALYTICS:-true}
      - LOG_API_CALLS=${LOG_API_CALLS:-true}
      - SESSION_CLEANUP_HOURS=${SESSION_CLEANUP_HOURS:-24}
      
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-["*"]}
      
      # Tourvisor API
      - TOURVISOR_AUTH_LOGIN=${TOURVISOR_AUTH_LOGIN}
      - TOURVISOR_AUTH_PASS=${TOURVISOR_AUTH_PASS}
      - TOURVISOR_BASE_URL=${TOURVISOR_BASE_URL:-http://tourvisor.ru/xml}
      - TOURVISOR_TIMEOUT=${TOURVISOR_TIMEOUT:-30}
      - TOURVISOR_MOCK=${TOURVISOR_MOCK:-false}
      
      # YandexGPT API
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID}
      - YANDEX_API_KEY=${YANDEX_API_KEY}
      - YANDEX_MODEL=${YANDEX_MODEL:-yandexgpt-lite}
      - YANDEX_GPT_ENABLED=${YANDEX_GPT_ENABLED:-true}
      
      # Настройки поиска
      - DEFAULT_NIGHTS_MIN=${DEFAULT_NIGHTS_MIN:-7}
      - DEFAULT_NIGHTS_MAX=${DEFAULT_NIGHTS_MAX:-14}
      - MAX_TOUR_OFFERS=${MAX_TOUR_OFFERS:-5}
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    depends_on:
      postgres:
        condition: service_healthy
    
    networks:
      - mgp_network
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:14-alpine
    container_name: mgp_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mgp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mgp_assistant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mgp_user} -d ${POSTGRES_DB:-mgp_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mgp_network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ==================== Nginx (опционально для SSL) ====================
  # Раскомментируйте если нужен nginx перед приложением
  # nginx:
  #   image: nginx:alpine
  #   container_name: mgp_nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - mgp-api
  #   networks:
  #     - mgp_network

networks:
  mgp_network:
    driver: bridge

volumes:
  postgres_data:
    name: mgp_postgres_prod_data
